name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: ./node_modules/.bin/tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: typecheck
    env:
      # Nilai dummy agar `next build` bisa prerender tanpa backend asli.
      # Nilai production yang sebenarnya di-inject saat deploy via env server.
      NEXT_PUBLIC_API_URL: https://app.sdmuhammadiyah3smd.com/api/v2
      NEXT_PUBLIC_STORAGE_URL: https://app.sdmuhammadiyah3smd.com/storage
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
